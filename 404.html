<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>404 — STILL HERE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--text:#f1eadc;--muted:#9a9b98;--gold:#c9a66b}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(201,166,107,.12),transparent 30%),#07090d;color:var(--text);font-family:Inter,Arial,sans-serif;text-align:center;overflow:hidden}main{width:min(700px,90vw);padding:40px}.mark{margin:auto;width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font:600 22px Cinzel,serif}.eyebrow{margin:25px 0 18px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.3em}.code{font:600 clamp(90px,20vw,180px)/.8 Cinzel,Georgia,serif;letter-spacing:-.06em}.code em{color:var(--gold);font-style:normal}h1{font:500 clamp(30px,5vw,48px) Cinzel,Georgia,serif;margin:40px 0 14px}p{color:var(--muted);line-height:1.8;font-size:14px}.button{display:inline-block;margin-top:22px;padding:14px 20px;background:var(--text);color:#080a0d;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.15em}.hint{margin-top:35px;font:12px Cinzel,serif;color:#666;letter-spacing:.08em}
</style>
</head>
<body><main>
<div class="mark">H</div>
<div class="eyebrow">FILE H-0404 · LOCATION UNKNOWN</div>
<div class="code">4<em>0</em>4</div>
<h1>He was HERE.</h1>
<p>Apparently, this page wasn't.<br>Don't worry. He's seen stranger things.</p>
<a class="button" href="./">RETURN TO THE HEREVERSE</a>
<div class="hint">THE WORLD CHANGES. HE STAYS.</div>
</main></body>
</html>
